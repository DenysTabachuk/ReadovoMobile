services:
  postgres:
    image: postgres:16-alpine
    container_name: readovo-postgres
    environment:
      POSTGRES_DB: readovo
      POSTGRES_PASSWORD: readovo_password
      POSTGRES_USER: readovo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
