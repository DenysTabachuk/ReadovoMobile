services:
  postgres:
    image: postgres:16-alpine
    container_name: speakly-postgres
    environment:
      POSTGRES_DB: speakly
      POSTGRES_PASSWORD: speakly_password
      POSTGRES_USER: speakly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
