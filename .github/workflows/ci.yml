name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  root:
    name: Root tooling quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Knip and its formatter belong to root tooling, so this job does not need
      # frontend or backend dependencies to inspect root scripts and config.
      - name: Install root dependencies
        id: install
        run: npm ci

      - name: Audit tooling formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Knip (root tooling)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run audit:unused:root

  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Prisma reads DATABASE_URL while loading its config during `npm ci`.
    # Client generation only validates this URL; it does not connect to a database.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/readovo_ci
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # Knip is installed at root; no frontend installation is needed here.
      - name: Install audit tooling
        id: audit_tools
        working-directory: .
        env:
          HUSKY: "0"
        run: npm ci

      - name: Install dependencies
        id: install
        run: npm ci

      - name: TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: OpenAPI freshness (backend installation only)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run openapi:check

      - name: Knip (backend)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.audit_tools.outcome == 'success' }}
        working-directory: .
        run: npm run audit:unused:backend

      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Prettier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --runInBand

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # Install the shared Knip executable; analyze only the frontend workspace.
      - name: Install audit tooling
        id: audit_tools
        working-directory: .
        env:
          HUSKY: "0"
        run: npm ci

      - name: Install dependencies
        id: install
        run: npm ci

      - name: TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Transport type freshness (frontend installation only)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run api-types:check

      - name: Knip (frontend)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.audit_tools.outcome == 'success' }}
        working-directory: .
        run: npm run audit:unused:frontend

      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Prettier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --runInBand

      - name: Repository documentation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run docs:check
