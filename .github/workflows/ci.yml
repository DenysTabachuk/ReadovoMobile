name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: ESLint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Prettier
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test -- --runInBand

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: ESLint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Prettier
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test -- --runInBand
